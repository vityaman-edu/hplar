name:                hplar
version:             0.1.0.0
github:              "vityaman-edu/hplar"
license:             BSD-3-Clause
author:              "Victor Smirmov"
maintainer:          "vityaman.dev@yandex.ru"
copyright:           "2026 Victor Smirmov"

extra-source-files:
- README.md

description:         Please see the README on GitHub at <https://github.com/vityaman-edu/hplar#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  hplar-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hplar

tests:
  hplar-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hplar
    - hspec
